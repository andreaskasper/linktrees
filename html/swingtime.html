<title>SwingTime Denver 2026 — West Coast Swing · September 10–14</title>
<meta name="description" content="SwingTime Denver 2026 · September 10–14 · DoubleTree by Hilton Denver. Schedule, competitions, comp videos, FAQ, location, tickets and socials — all in one place.">
<meta name="theme-color" content="#050507">
<meta property="og:title" content="SwingTime Denver 2026">
<meta property="og:description" content="It's SwingTime Baby! September 10–14, 2026 · Denver · WSDC Registry Event">
<meta property="og:image" content="https://swingtimewcs.com/wp-content/uploads/2026/07/Swingtime2026.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#050507;
    --ink:#f4f6ff;
    --mute:#9aa3b8;
    --pink:#ff2fb4;
    --violet:#8b4dff;
    --blue:#3d7dff;
    --cyan:#1fe8ff;
    --green:#4dff9c;
    --denver:#6d9be0;
    --spectrum:linear-gradient(90deg,var(--pink) 0%,var(--violet) 28%,var(--blue) 50%,var(--cyan) 72%,var(--green) 100%);
    /* same spectrum, mirrored, so a background-position loop has no seam */
    --loop:linear-gradient(90deg,var(--pink) 0%,var(--violet) 14%,var(--blue) 25%,var(--cyan) 36%,var(--green) 50%,var(--cyan) 64%,var(--blue) 75%,var(--violet) 86%,var(--pink) 100%);
    --glass:rgba(10,12,20,.72);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  html{background:var(--bg);}

  body{
    font-family:"Montserrat",system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    display:flex;
    justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 16px 56px;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ================= animated neon spectrum ================= */
  .stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* CSS-only equalizer — shown only when JS is unavailable (html.nojs) */
  .eq{
    display:none;
    position:absolute;left:0;right:0;top:50%;
    height:72vh;transform:translateY(-50%);
    align-items:center;justify-content:space-between;
    gap:2px;padding:0 2px;
  }
  html.nojs .eq{display:flex;}
  .eq i{
    flex:1;height:22%;display:block;border-radius:2px;
    background:var(--spectrum);
    background-attachment:fixed;   /* each bar shows its own slice of the spectrum */
    opacity:.75;
    box-shadow:0 0 10px rgba(120,220,255,.35);
    animation:eqbar 2.4s ease-in-out infinite alternate;
    animation-delay:calc(var(--d) * -1s);
  }
  @keyframes eqbar{
    0%{height:6%;}
    100%{height:78%;}
  }

  /* soft bloom + vignette so the content stays readable */
  .stage::before{
    content:"";position:absolute;inset:-20%;
    background:
      radial-gradient(circle at 12% 30%, rgba(255,47,180,.22) 0 8%, transparent 32%),
      radial-gradient(circle at 88% 70%, rgba(77,255,156,.20) 0 8%, transparent 32%),
      radial-gradient(circle at 55% 45%, rgba(31,232,255,.14) 0 8%, transparent 30%);
    mix-blend-mode:screen;
    animation:bloom 22s ease-in-out infinite alternate;
  }
  .stage::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 46%, rgba(5,5,7,.55) 0 22%, rgba(5,5,7,.10) 60%, transparent 100%);
  }
  @keyframes bloom{
    0%{transform:translate(0,0) scale(1);opacity:.75;}
    100%{transform:translate(3%,-3%) scale(1.08);opacity:1;}
  }

  /* ================= card ================= */
  .card{
    position:relative;z-index:2;
    width:100%;max-width:500px;
    text-align:center;
    transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .25s ease-out;
    transform-style:preserve-3d;
  }

  /* ---- header / logo ---- */
  .logo{
    position:relative;
    margin:6px auto 4px;
    max-width:440px;
    animation:rise .9s cubic-bezier(.2,.9,.2,1) both;
  }
  .logo svg{
    display:block;width:100%;height:auto;
    filter:drop-shadow(0 0 14px rgba(255,255,255,.35)) drop-shadow(0 8px 22px rgba(0,0,0,.6));
    animation:breathe 4.5s ease-in-out infinite;
    transform-origin:50% 50%;
  }
  .logo svg.beat{animation:beat .45s cubic-bezier(.2,1.6,.4,1);}
  @keyframes breathe{
    0%,100%{transform:scale(1);filter:drop-shadow(0 0 12px rgba(255,255,255,.30)) drop-shadow(0 8px 22px rgba(0,0,0,.6));}
    50%{transform:scale(1.018);filter:drop-shadow(0 0 26px rgba(120,220,255,.55)) drop-shadow(0 8px 22px rgba(0,0,0,.6));}
  }
  @keyframes beat{
    0%{transform:scale(1);}
    35%{transform:scale(1.07) rotate(-1deg);}
    100%{transform:scale(1);}
  }
  .tag{
    display:inline-block;
    font-family:"Michroma",monospace;
    font-size:11px;letter-spacing:4px;text-transform:uppercase;
    color:var(--mute);
    margin:4px 0 14px;
    animation:rise .9s .1s cubic-bezier(.2,.9,.2,1) both;
  }

  /* ---- WSDC badge: spinning ring ---- */
  .badgerow{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 16px;
    margin:2px 0 8px;
    animation:rise .9s .18s cubic-bezier(.2,.9,.2,1) both;
  }
  .wsdc{
    position:relative;width:86px;height:86px;flex:none;
  }
  .wsdc svg{position:absolute;inset:0;width:100%;height:100%;}
  .wsdc .ring{animation:spin 18s linear infinite;transform-origin:50% 50%;}
  .wsdc .ring text{font-family:"Michroma",monospace;font-size:8.6px;letter-spacing:1.6px;fill:var(--ink);text-transform:uppercase;}
  .wsdc .core{
    position:absolute;left:50%;top:50%;
    width:50px;height:50px;transform:translate(-50%,-50%);
    border-radius:50%;
    background:var(--glass);
    border:1.5px solid transparent;
    background-image:linear-gradient(var(--glass),var(--glass)),var(--spectrum);
    background-origin:border-box;background-clip:padding-box,border-box;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;letter-spacing:.5px;color:#fff;
    box-shadow:0 0 18px rgba(31,232,255,.25);
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .meta{
    display:inline-flex;align-items:center;gap:10px;
    padding:10px 18px;
    border-radius:999px;
    background:var(--glass);
    border:1.5px solid transparent;
    background-image:linear-gradient(var(--glass),var(--glass)),var(--spectrum);
    background-origin:border-box;background-clip:padding-box,border-box;
    font-weight:800;font-size:14px;letter-spacing:2.5px;text-transform:uppercase;
    color:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 22px rgba(139,77,255,.25);
  }
  .meta .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(77,255,156,.7);
    animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;
  }
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(77,255,156,.7);}
    100%{box-shadow:0 0 0 12px rgba(77,255,156,0);}
  }
  .slogan{
    margin:12px 0 24px;
    font-family:"Michroma",monospace;
    font-size:11px;letter-spacing:3px;text-transform:uppercase;
    background:var(--loop);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% 100%;
    animation:rise .9s .26s cubic-bezier(.2,.9,.2,1) both, slide 6s linear infinite;
  }
  @keyframes slide{to{background-position:200% 0;}}

  /* ---- links ---- */
  .links{display:flex;flex-direction:column;gap:13px;}
  .link{
    --i:0;
    position:relative;
    display:flex;align-items:center;gap:14px;
    text-decoration:none;
    padding:17px 20px;
    border-radius:16px;
    background:var(--glass);
    color:var(--ink);
    font-weight:800;font-size:17px;letter-spacing:1.4px;text-transform:uppercase;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    isolation:isolate;
    overflow:hidden;
    transition:transform .18s cubic-bezier(.2,.9,.2,1), box-shadow .18s ease;
    animation:rise .8s calc(.32s + var(--i) * .08s) cubic-bezier(.2,.9,.2,1) both;
  }
  /* gradient border via mask */
  .link::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
    background:var(--loop);
    background-size:200% 100%;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:slide 5s linear infinite;
    animation-delay:calc(var(--i) * -.7s);
    z-index:-1;
  }
  /* hover glow sweep */
  .link::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);
    transform:translateX(-120%);
    transition:transform .5s ease;
    z-index:-1;
  }
  .link:hover::after,.link:focus-visible::after{transform:translateX(120%);}
  .link:hover,.link:focus-visible{
    transform:translateY(-3px) scale(1.012);
    box-shadow:0 16px 34px rgba(0,0,0,.5),0 0 28px rgba(31,232,255,.22);
    outline:none;
  }
  .link:active{transform:translateY(0) scale(.985);}
  .link .ico{font-size:22px;width:30px;text-align:center;transition:transform .25s cubic-bezier(.2,1.6,.4,1);}
  .link:hover .ico{transform:scale(1.25) rotate(-8deg);}
  .link .txt{flex:1;text-align:left;}
  .link .arr{
    font-size:16px;
    background:var(--spectrum);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    transition:transform .2s ease;
  }
  .link:hover .arr{transform:translateX(5px);}

  .link.primary{
    color:#fff;
    background:var(--loop);
    background-size:200% 100%;
    animation:rise .8s calc(.32s + var(--i) * .08s) cubic-bezier(.2,.9,.2,1) both, slide 6s linear infinite;
    box-shadow:0 12px 30px rgba(139,77,255,.35),0 0 30px rgba(255,47,180,.25);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  .link.primary::before{display:none;}
  .link.primary .arr{color:#fff;-webkit-text-fill-color:#fff;}
  .link.primary:hover{box-shadow:0 18px 40px rgba(139,77,255,.5),0 0 40px rgba(31,232,255,.35);}

  .link.deal{color:#0a0f0d;background:linear-gradient(135deg,var(--green),var(--cyan));}
  .link.deal::before{display:none;}
  .link.deal .arr{color:#0a0f0d;-webkit-text-fill-color:#0a0f0d;}
  .link.deal .pill{
    font-size:11px;letter-spacing:1px;
    background:#0a0f0d;color:var(--green);
    padding:4px 8px;border-radius:999px;
    margin-left:6px;
  }

  /* ---- socials ---- */
  .socials{
    display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap;
    animation:rise .8s 1.03s cubic-bezier(.2,.9,.2,1) both;
  }
  .socials a{
    position:relative;
    width:54px;height:54px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--glass);
    border:1.5px solid transparent;
    background-image:linear-gradient(var(--glass),var(--glass)),var(--spectrum);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
    transition:transform .25s cubic-bezier(.2,1.6,.4,1), box-shadow .2s ease;
  }
  .socials a:hover,.socials a:focus-visible{
    transform:translateY(-4px) rotate(-8deg) scale(1.08);
    box-shadow:0 14px 28px rgba(0,0,0,.5),0 0 22px rgba(31,232,255,.35);
    outline:none;
  }
  .socials svg{width:24px;height:24px;fill:#fff;}

  footer{
    margin-top:26px;
    font-size:11.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--mute);
    animation:rise .8s 1.13s cubic-bezier(.2,.9,.2,1) both;
  }
  footer a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--cyan);}

  @keyframes rise{
    from{opacity:0;transform:translateY(18px) scale(.98);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  /* burst particles */
  .burst{position:fixed;inset:0;z-index:3;pointer-events:none;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition:none !important;}
    .card{transform:none !important;}
    .logo .sweep{display:none;}
  }
  @media (max-width:400px){
    .link{font-size:15px;padding:15px 16px;}
    .meta{font-size:12.5px;letter-spacing:2px;}
  }
</style>
</head>

<script>
(function(){
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- neon spectrum ---------- */
  var cv = document.getElementById('spectrum'), ctx = cv.getContext('2d');
  var W=0,H=0,DPR=1,bars=[],N=0,BW=3,GAP=2;
  var stops=[[255,47,180],[139,77,255],[61,125,255],[31,232,255],[77,255,156]];
  var px=-1, pt=0;   // pointer x (0..1) and last-move timestamp

  function lerp(a,b,t){return a+(b-a)*t;}
  function color(u){ // u in 0..1 -> rgb array along the spectrum
    var s=u*(stops.length-1), i=Math.min(stops.length-2,Math.floor(s)), t=s-i;
    var a=stops[i], b=stops[i+1];
    return [lerp(a[0],b[0],t)|0, lerp(a[1],b[1],t)|0, lerp(a[2],b[2],t)|0];
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*DPR; cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    BW = W<600?3:4; GAP = W<600?2:3;
    N=Math.ceil(W/(BW+GAP));
    bars=[];
    for(var i=0;i<N;i++){
      var u=i/(N-1);
      var c=color(u);
      bars.push({u:u, x:i*(BW+GAP), c:c, rgb:'rgb('+c[0]+','+c[1]+','+c[2]+')', ph:Math.random()*6.28, sp:0.6+Math.random()*0.9, h:0});
    }
  }
  function envelope(u,t){ // slow-moving macro shape, like the poster
    return 0.30 + 0.70*(0.5+0.5*Math.sin(u*9.4 + t*0.35)) * (0.55+0.45*Math.sin(u*3.1 - t*0.18));
  }
  function frame(t){
    t*=0.001;
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    var cy=H*0.5, maxH=H*0.42;
    var burst = px>=0 ? Math.max(0, 1-(performance.now()-pt)/900) : 0;
    for(var i=0;i<N;i++){
      var b=bars[i];
      var beat=0.5+0.5*Math.sin(t*2.2*b.sp + b.ph + b.u*14);
      var fine=0.5+0.5*Math.sin(t*5.1 + i*0.9);
      var h=maxH*envelope(b.u,t)*(0.35+0.65*beat)*(0.7+0.3*fine);
      if(burst>0){
        var d=(b.u-px)*W/90; h += maxH*0.9*burst*Math.exp(-d*d);
      }
      b.h += (h-b.h)*0.22;   // smoothing
      var hh=b.h;
      // glow pass
      ctx.globalAlpha=0.18;
      ctx.fillStyle=b.rgb;
      ctx.fillRect(b.x-2, cy-hh-6, BW+4, hh*2+12);
      // bar pass
      ctx.globalAlpha=0.92;
      ctx.fillRect(b.x, cy-hh, BW, hh*2);
      // hot core
      ctx.globalAlpha=0.55;
      ctx.fillStyle='#fff';
      ctx.fillRect(b.x, cy-hh*0.18, BW, hh*0.36);
    }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  var running=false;
  function loop(t){ if(!running) return; frame(t); requestAnimationFrame(loop); }
  function start(){ if(running||reduce) return; running=true; requestAnimationFrame(loop); }
  function stop(){ running=false; }
  function still(){ for(var k=0;k<40;k++){ frame(4200); } }
  resize(); window.addEventListener('resize', function(){ resize(); if(reduce) still(); });
  if(reduce){ still(); } else { start(); }
  document.addEventListener('visibilitychange', function(){ document.hidden ? stop() : start(); });

  /* ---------- pointer / touch reactivity ---------- */
  var card=document.getElementById('card');
  function onMove(x,y){
    px=x/W; pt=performance.now();
    if(reduce || W<700) return;           // tilt only on larger screens
    var rx=((y/H)-0.5)*-6, ry=((x/W)-0.5)*8;
    card.style.setProperty('--rx', rx.toFixed(2)+'deg');
    card.style.setProperty('--ry', ry.toFixed(2)+'deg');
  }
  window.addEventListener('pointermove', function(e){ onMove(e.clientX,e.clientY); }, {passive:true});
  window.addEventListener('pointerdown', function(e){ px=e.clientX/W; pt=performance.now(); }, {passive:true});
  window.addEventListener('pointerleave', function(){ card.style.setProperty('--rx','0deg'); card.style.setProperty('--ry','0deg'); });

  /* ---------- confetti burst on tap ---------- */
  var bc=document.getElementById('burst'), bctx=bc.getContext('2d'), parts=[], bRun=false;
  function bResize(){ bc.width=W*DPR; bc.height=H*DPR; bctx.setTransform(DPR,0,0,DPR,0,0); }
  bResize(); window.addEventListener('resize', bResize);
  function spawn(x,y){
    if(reduce) return;
    for(var i=0;i<18;i++){
      var a=Math.random()*6.283, s=2+Math.random()*5, c=color(Math.random());
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,r:2+Math.random()*3,c:'rgb('+c[0]+','+c[1]+','+c[2]+')'});
    }
    if(!bRun){ bRun=true; requestAnimationFrame(bLoop); }
  }
  function bLoop(){
    bctx.clearRect(0,0,W,H);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.vx*=0.98; p.life-=0.025;
      if(p.life<=0){ parts.splice(i,1); continue; }
      bctx.globalAlpha=p.life; bctx.fillStyle=p.c;
      bctx.beginPath(); bctx.arc(p.x,p.y,p.r*p.life,0,6.283); bctx.fill();
    }
    bctx.globalAlpha=1;
    if(parts.length){ requestAnimationFrame(bLoop); } else { bRun=false; }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.link,.socials a'), function(el){
    el.addEventListener('pointerdown', function(e){ spawn(e.clientX,e.clientY); }, {passive:true});
  });

  /* ---------- logo beat on tap ---------- */
  var logo=document.getElementById('logo');
  logo.addEventListener('pointerdown', function(e){
    logo.classList.remove('beat'); void logo.getBoundingClientRect(); logo.classList.add('beat');
    px=e.clientX/W; pt=performance.now();
    spawn(e.clientX,e.clientY);
  }, {passive:true});
  logo.addEventListener('animationend', function(){ logo.classList.remove('beat'); });
})();
</script>
<script>document.documentElement.classList.remove('nojs');</script>
</body>
