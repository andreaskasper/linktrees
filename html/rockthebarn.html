<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock the Barn — Links</title>
<meta name="description" content="Rock the Barn · West Coast Swing in Sweden — Schedule, Live Scoring & Website.">
<style>
  /* ---------- Base ---------- */
  :root{
    --barn-red:#7a2a22;
    --barn-red-dark:#5c1c16;
    --coral:#ef6c6c;
    --wood:#c68a4e;
    --wood-dark:#8a5a2c;
    --wood-edge:#3a2414;
    --cream:#f6ead6;
    --glow:#ffd98a;
    --swe-blue:#0d5eaf;
    --swe-yellow:#ffcd00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--cream);
    min-height:100dvh;
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #8a3a2e 0%, #5a1e18 45%, #2e0f0c 100%);
  }

  /* ---------- Barn wall (vertical planks) ---------- */
  .wall{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.55)),
      repeating-linear-gradient(90deg,
        var(--barn-red) 0px, var(--barn-red) 44px,
        var(--barn-red-dark) 44px, var(--barn-red-dark) 48px),
      repeating-linear-gradient(0deg,
        rgba(0,0,0,.05) 0px, rgba(0,0,0,.05) 3px,
        rgba(255,255,255,.02) 3px, rgba(255,255,255,.02) 6px);
    opacity:.85;
    mix-blend-mode:multiply;
  }
  /* soft night sky glow + tiny stars up top */
  .stars{position:fixed; inset:0 0 auto 0; height:45%; z-index:0; pointer-events:none; opacity:.7}
  .stars i{position:absolute; width:2px; height:2px; border-radius:50%; background:#fff3d6;
    box-shadow:0 0 6px 1px rgba(255,243,214,.8); animation:twinkle 3.5s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

  /* ---------- String lights (festoon) ---------- */
  .lights{position:relative; z-index:3; width:100%; height:70px; margin-top:-4px}
  .lights svg{display:block; width:100%; height:100%}
  .bulb{transform-box:fill-box; transform-origin:center top; animation:glow 2.6s ease-in-out infinite}
  .bulb:nth-child(2n){animation-delay:.4s}
  .bulb:nth-child(3n){animation-delay:.9s}
  .bulb:nth-child(4n){animation-delay:1.3s}
  @keyframes glow{0%,100%{opacity:.55; filter:drop-shadow(0 0 2px var(--glow))}
    50%{opacity:1; filter:drop-shadow(0 0 8px var(--glow))}}

  /* ---------- Layout ---------- */
  .stage{
    position:relative; z-index:2;
    max-width:520px; margin:0 auto;
    padding:6px 22px 140px;
    text-align:center;
  }

  /* ---------- Logo ---------- */
  .logo-wrap{margin:6px auto 10px; max-width:330px; animation:drop .9s cubic-bezier(.2,.8,.2,1.2) both}
  .logo-wrap img{width:100%; height:auto; filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
  @keyframes drop{0%{transform:translateY(-40px) rotate(-3deg); opacity:0}100%{transform:none; opacity:1}}

  .tagline{
    font-size:1.02rem; letter-spacing:.5px; color:var(--cream);
    text-shadow:0 2px 4px rgba(0,0,0,.6); margin:2px 0 4px;
  }
  .tagline b{color:var(--swe-yellow)}
  .subline{font-size:.86rem; opacity:.85; margin-bottom:26px}
  .swe-flag{display:inline-block; vertical-align:-2px; width:20px; height:13px; border-radius:2px;
    margin:0 4px; background:
      linear-gradient(var(--swe-yellow),var(--swe-yellow)) 6px 0/4px 100% no-repeat,
      linear-gradient(var(--swe-yellow),var(--swe-yellow)) 0 5px/100% 3px no-repeat,
      var(--swe-blue); box-shadow:0 1px 2px rgba(0,0,0,.4)}

  /* ---------- Link signs (nailed wooden planks) ---------- */
  .signs{display:flex; flex-direction:column; gap:24px}
  .sign{
    position:relative; display:flex; align-items:center; gap:16px;
    text-decoration:none; color:#2a1a0e;
    padding:20px 22px; border-radius:8px;
    border:3px solid var(--wood-edge);
    background-color:var(--wood);
    background-image:
      repeating-linear-gradient(92deg, rgba(0,0,0,.10) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(88deg, rgba(255,255,255,.10) 0 1px, transparent 1px 11px),
      linear-gradient(180deg, #d59a5e, #a86a34);
    box-shadow:0 10px 0 -2px rgba(0,0,0,.35), 0 16px 22px rgba(0,0,0,.45),
      inset 0 2px 0 rgba(255,255,255,.25), inset 0 -6px 12px rgba(0,0,0,.25);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, filter .25s;
    will-change:transform;
  }
  .sign:nth-child(1){transform:rotate(-1.3deg)}
  .sign:nth-child(2){transform:rotate(1deg)}
  .sign:nth-child(3){transform:rotate(-.6deg)}
  .sign:hover,.sign:focus-visible{
    transform:rotate(0deg) translateY(-6px) scale(1.03);
    box-shadow:0 16px 0 -2px rgba(0,0,0,.35), 0 26px 34px rgba(0,0,0,.5),
      inset 0 2px 0 rgba(255,255,255,.3);
    filter:brightness(1.05); outline:none;
    animation:wobble .5s ease;
  }
  @keyframes wobble{0%{transform:translateY(-6px) rotate(0)}25%{transform:translateY(-6px) rotate(1.4deg)}
    60%{transform:translateY(-6px) rotate(-1deg)}100%{transform:translateY(-6px) rotate(0)}}
  .sign:active{transform:translateY(-1px) scale(.99)}

  /* nail heads in the corners */
  .sign::before,.sign::after{
    content:""; position:absolute; width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #b9b9b9 35%, #555 75%, #222 100%);
    box-shadow:0 1px 2px rgba(0,0,0,.6); top:9px}
  .sign::before{left:10px}
  .sign::after{right:10px}
  .nailrow{position:absolute; left:10px; right:10px; bottom:9px; height:11px; pointer-events:none}
  .nailrow i{position:absolute; width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #b9b9b9 35%, #555 75%, #222 100%);
    box-shadow:0 1px 2px rgba(0,0,0,.6)}
  .nailrow i.l{left:0}.nailrow i.r{right:0}

  .sign .ic{
    flex:0 0 auto; width:52px; height:52px; border-radius:12px;
    display:grid; place-items:center; font-size:1.7rem;
    background:linear-gradient(160deg,var(--coral),#c9463f);
    border:2px solid var(--wood-edge);
    box-shadow:inset 0 2px 3px rgba(255,255,255,.35), 0 3px 6px rgba(0,0,0,.35);
  }
  .sign .txt{text-align:left; line-height:1.15}
  .sign .txt .t{font-size:1.28rem; font-weight:800; letter-spacing:.3px;
    text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .sign .txt .s{font-size:.82rem; color:#5a3a1e; opacity:.9; margin-top:2px}
  .sign .arrow{margin-left:auto; font-size:1.5rem; color:#5a3a1e; transition:transform .25s}
  .sign:hover .arrow{transform:translateX(4px)}

  /* ---------- Dala horse mascot + ground ---------- */
  .ground{position:fixed; left:0; right:0; bottom:0; height:120px; z-index:1; pointer-events:none}
  .ground .hay{position:absolute; bottom:0; width:100%; height:70px;
    background:
      radial-gradient(140% 100% at 50% 100%, #b9863f 0%, #8a5f28 60%, #5f3f18 100%);
    border-top:4px solid #4a2f12;
    box-shadow:0 -6px 16px rgba(0,0,0,.4);
    background-image:repeating-linear-gradient(85deg, rgba(0,0,0,.10) 0 2px, transparent 2px 9px)}
  .dala{position:fixed; left:16px; bottom:52px; z-index:2; width:104px; height:auto;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)); transform-origin:bottom center;
    animation:rock 4s ease-in-out infinite}
  @keyframes rock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .dala:hover{animation:hop .6s ease}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-6deg)}
    60%{transform:translateY(0) rotate(4deg)}}

  /* floating music notes */
  .note{position:fixed; z-index:1; color:var(--glow); opacity:.0; font-size:1.4rem; pointer-events:none;
    animation:float 6s linear infinite}
  .note:nth-child(1){left:14%; animation-delay:0s}
  .note:nth-child(2){left:82%; animation-delay:2s; font-size:1.1rem}
  .note:nth-child(3){left:60%; animation-delay:4s; font-size:1.7rem}
  @keyframes float{0%{transform:translateY(30dvh) rotate(0); opacity:0}
    15%{opacity:.7}85%{opacity:.7}100%{transform:translateY(-10dvh) rotate(25deg); opacity:0}}

  /* ---------- Footer ---------- */
  .foot{position:relative; z-index:2; text-align:center; font-size:.78rem;
    opacity:.75; margin-top:34px}
  .foot a{color:var(--glow); text-decoration:none}

  @media (max-width:420px){
    .stage{padding:6px 16px 150px}
    .sign{padding:16px 16px}
    .sign .ic{width:46px;height:46px;font-size:1.5rem}
    .sign .txt .t{font-size:1.14rem}
    .dala{width:82px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>

<script>
  // twinkling stars
  (function(){
    var s=document.getElementById('stars'), n=34, h='';
    for(var i=0;i<n;i++){
      h+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*100).toFixed(1)+
         '%;animation-delay:'+(Math.random()*3.5).toFixed(1)+'s"></i>';
    }
    s.innerHTML=h;

    // festoon bulbs sampled along the wire path
    var path=document.querySelector('.lights path'),
        g=document.getElementById('bulbs'),
        L=path.getTotalLength(), count=26, cols=['#ffd98a','#ff9c6c','#8ad0ff','#ffe28a','#ff8f8f'],
        svgns='http://www.w3.org/2000/svg', out='';
    for(var j=1;j<count;j++){
      var p=path.getPointAtLength(L*j/count),
          c=cols[j%cols.length];
      out+='<g class="bulb"><line x1="'+p.x.toFixed(1)+'" y1="'+p.y.toFixed(1)+'" x2="'+p.x.toFixed(1)+
           '" y2="'+(p.y+9).toFixed(1)+'" stroke="#2a140c" stroke-width="2"/>'+
           '<circle cx="'+p.x.toFixed(1)+'" cy="'+(p.y+13).toFixed(1)+'" r="5" fill="'+c+'"/></g>';
    }
    g.innerHTML=out;
  })();
</script>
