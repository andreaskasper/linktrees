<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The West Coast Swing German Open 2026 — Freiburg</title>
<meta name="description" content="German Open 2026 · August 5–9 · Ballhaus Freiburg. Schedule, competitions, livestream, registration and location — all in one place.">
<meta name="theme-color" content="#a43222">
<meta property="og:title" content="The West Coast Swing German Open 2026">
<meta property="og:description" content="August 5–9 2026 · Ballhaus Freiburg · WSDC Registry Event">
<meta property="og:image" content="https://go-wcs.com/wp-content/uploads/2026/07/social_share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414;
    --red:#d61f1f;
    --gold:#ffce00;
    --cream:#fff6e2;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{min-height:100%;}

  body{
    font-family:"Montserrat",system-ui,sans-serif;
    color:var(--ink);
    background:
      linear-gradient(163deg,
        #171717 0 25%,
        #c81a1a 25% 42%,
        #e02424 42% 60%,
        #ffce00 60% 100%);
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    padding:26px 16px 54px;
    overflow-x:hidden;
  }

  /* ---- low-poly german flag mosaic ---- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .bg svg{
    width:100%;height:100%;display:block;
    transform-origin:50% 50%;
    animation:drift 46s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{transform:scale(1.02) translate(-.6%,.4%);}
    100%{transform:scale(1.06) translate(.8%,-.6%);}
  }
  /* facets are translucent, so the flag bands below always show through */
  /* soft light bloom drifting over the mosaic */
  .bg::after{
    content:"";
    position:absolute;inset:-20%;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,.30) 0 6%, transparent 24%),
      radial-gradient(circle at 72% 40%, rgba(255,255,255,.22) 0 5%, transparent 22%),
      radial-gradient(circle at 45% 78%, rgba(255,255,255,.20) 0 6%, transparent 26%);
    mix-blend-mode:screen;
    animation:bloom 18s ease-in-out infinite alternate;
  }
  @keyframes bloom{
    0%{transform:translate(0,0) scale(1);opacity:.8;}
    100%{transform:translate(2%,-2.5%) scale(1.07);opacity:1;}
  }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:500px;
    text-align:center;
  }

  /* ---- header (official logo) ---- */
  .logo{
    position:relative;
    padding:4px 0 2px;
  }
  .logo img{
    position:relative;
    z-index:1;
    display:block;
    width:100%;
    max-width:430px;
    height:auto;
    margin:0 auto;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.28));
  }
  .glow{
    position:absolute;
    left:50%;top:50%;
    width:104%;height:82%;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(255,255,255,.98) 0 38%, rgba(255,255,255,.62) 54%, rgba(255,255,255,0) 74%);
    filter:blur(10px);
    z-index:0;
  }

  .wsdc{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:76px;height:76px;
    border-radius:50%;
    background:#1b1b1b;
    border:3px solid #4aa3d8;
    color:#fff;
    font-size:7px;
    font-weight:800;
    letter-spacing:1.2px;
    line-height:1.35;
    text-transform:uppercase;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
    margin:12px 0 4px;
    transform:rotate(-8deg);
  }
  .wsdc b{font-size:19px;letter-spacing:.5px;color:#fff;}

  .meta{
    display:inline-block;
    background:var(--ink);
    color:var(--gold);
    font-weight:800;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:9px 18px;
    margin:10px 0 6px;
    clip-path:polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .slogan{
    display:inline-block;
    background:rgba(255,246,226,.92);
    color:var(--ink);
    font-weight:600;
    font-size:12.5px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    padding:7px 16px;
    margin-bottom:24px;
    clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 100%, 12px 100%);
  }

  /* ---- links ---- */
  .links{display:flex;flex-direction:column;gap:13px;}
  .link{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    background:rgba(17,17,17,.94);
    color:var(--cream);
    border:2px solid var(--gold);
    padding:16px 20px;
    font-weight:800;
    font-size:17px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    clip-path:polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    box-shadow:0 8px 18px rgba(0,0,0,.30);
    transition:transform .14s ease, background .14s ease, color .14s ease;
  }
  .link:hover{
    transform:translateY(-3px);
    background:var(--red);
    border-color:#fff;
  }
  .link.primary{
    background:rgba(214,31,31,.96);
    border-color:#fff;
    color:#fff;
  }
  .link.primary:hover{background:var(--ink);border-color:var(--gold);}
  .link .ico{font-size:22px;width:28px;text-align:center;}
  .link .txt{flex:1;text-align:left;}
  .link .arr{color:var(--gold);font-size:15px;}
  .link.primary .arr{color:#fff;}
  .link.deal{
    background:rgba(255,206,0,.95);
    border-color:var(--ink);
    color:var(--ink);
  }
  .link.deal .arr{color:var(--ink);}
  .link.deal:hover{background:var(--ink);color:var(--gold);border-color:var(--gold);}
  .link.deal:hover .arr{color:var(--gold);}

  /* ---- socials ---- */
  .socials{display:flex;justify-content:center;gap:14px;margin-top:22px;}
  .socials a{
    width:54px;height:54px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(17,17,17,.94);
    border:2px solid var(--gold);
    clip-path:polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    box-shadow:0 6px 14px rgba(0,0,0,.3);
    transition:transform .14s ease, background .14s ease;
  }
  .socials a:hover{transform:translateY(-3px);background:var(--red);}
  .socials svg{width:24px;height:24px;fill:var(--gold);}
  .socials a:hover svg{fill:#fff;}

  footer{
    margin-top:24px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--ink);
  }
  footer a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--ink);}

  /* mosaic palette + animated light/shadow facets */
.f0{fill:rgba(255,255,255,0.14)}.f1{fill:rgba(255,255,255,0.09)}.f2{fill:rgba(255,255,255,0.05)}.f3{fill:rgba(255,255,255,0.02)}.f4{fill:rgba(0,0,0,0.03)}.f5{fill:rgba(0,0,0,0.07)}.f6{fill:rgba(0,0,0,0.11)}.f7{fill:rgba(0,0,0,0.16)}@keyframes sha{0%{fill:rgba(255,255,255,0.15)}22%{fill:rgba(0,0,0,0.06)}46%{fill:rgba(0,0,0,0.17)}70%{fill:rgba(255,255,255,0.05)}100%{fill:rgba(255,255,255,0.15)}}@keyframes shb{0%{fill:rgba(0,0,0,0.16)}26%{fill:rgba(255,255,255,0.12)}52%{fill:rgba(255,255,255,0.03)}78%{fill:rgba(0,0,0,0.09)}100%{fill:rgba(0,0,0,0.16)}}@keyframes shc{0%{fill:rgba(255,255,255,0.04)}30%{fill:rgba(0,0,0,0.14)}58%{fill:rgba(255,255,255,0.15)}82%{fill:rgba(0,0,0,0.04)}100%{fill:rgba(255,255,255,0.04)}}.s0{animation:sha 18.0s -0.0s ease-in-out infinite}.s1{animation:shb 19.4s -16.5s ease-in-out infinite}.s2{animation:shc 20.7s -14.9s ease-in-out infinite}.s3{animation:sha 22.1s -13.4s ease-in-out infinite}.s4{animation:shb 23.5s -11.9s ease-in-out infinite}.s5{animation:shc 24.9s -10.4s ease-in-out infinite}.s6{animation:sha 26.2s -8.8s ease-in-out infinite}.s7{animation:shb 27.6s -7.3s ease-in-out infinite}.s8{animation:shc 29.0s -5.8s ease-in-out infinite}.s9{animation:sha 30.3s -4.2s ease-in-out infinite}.s10{animation:shb 31.7s -2.7s ease-in-out infinite}.s11{animation:shc 33.1s -1.2s ease-in-out infinite}.s12{animation:sha 34.4s -34.1s ease-in-out infinite}.s13{animation:shb 35.8s -33.9s ease-in-out infinite}.s14{animation:shc 37.2s -33.8s ease-in-out infinite}.s15{animation:sha 38.5s -33.6s ease-in-out infinite}.s16{animation:shb 39.9s -33.4s ease-in-out infinite}.s17{animation:shc 19.3s -8.6s ease-in-out infinite}.s18{animation:sha 20.7s -9.8s ease-in-out infinite}.s19{animation:shb 22.0s -11.0s ease-in-out infinite}.s20{animation:shc 23.4s -12.2s ease-in-out infinite}.s21{animation:sha 24.8s -13.4s ease-in-out infinite}.s22{animation:shb 26.1s -14.6s ease-in-out infinite}.s23{animation:shc 27.5s -15.8s ease-in-out infinite}

  @media (prefers-reduced-motion: reduce){
    .bg::after,.bg svg,.bg path{animation:none;}
  }
  @media (max-width:400px){
    .link{font-size:15px;padding:15px 16px;}
  }
</style>

<main class="card">
